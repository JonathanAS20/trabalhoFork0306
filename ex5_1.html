<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="ie=edge">

  <link rel="stylesheet" href="css/estilos.css">

  <title>Centro de Especialidade Odontológica</title>
</head>

<body>

  <img src="img/ex5_1.jpg" alt="Consultório Odontológico" class="alta">

  <h1>Centro de Especialidade Odontológica</h1>

  <p>

    Paciente:
    <input type="text" id="inPaciente" autofocus>

    Especialidade:
    <select id="inEspecialidade">

      <option value="Cirurgia e Traumatologia Buco-Maxilo-Facial">
        Cirurgia e Traumatologia Buco-Maxilo-Facial
      </option>

      <option value="Cirurgia Oral Menor">
        Cirurgia Oral Menor
      </option>

      <option value="Clínico Geral">
        Clínico Geral
      </option>

      <option value="Dentística">
        Dentística
      </option>

      <option value="Endodontia">
        Endodontia
      </option>

      <option value="Harmonização Orofacial">
        Harmonização Orofacial
      </option>

      <option value="Implantodontia">
        Implantodontia
      </option>

      <option value="Odontopediatria">
        Odontopediatria
      </option>

      <option value="Ortodontia">
        Ortodontia
      </option>

      <option value="Periodontia">
        Periodontia
      </option>

      <option value="Prevenção">
        Prevenção
      </option>

       <option value="Prótese">
        Prótese
      </option>

       <option value="Radiologia">
        Radiologia
      </option>

       <option value="Urgência/Emergência">
        Urgência/Emergência
      </option>


    </select>

    Valor:
    <input type="number" id="inValor" placeholder="R$">

    <br><br>

    Forma de Pagamento:
    <select id="inPagamento">

      <option value="Dinheiro">Dinheiro à vista</option>

      <option value="Pix">Pix</option>

      <option value="Débito">Cartão de Débito</option>

      <option value="Cheque">Cheque</option>

      <option value="Crédito">Cartão de Crédito</option>

    </select>

    <br><br>

    <input type="button" value="Adicionar" id="btAdicionar">

    <input type="button" value="Urgência" id="btUrgencia">

    <input type="button" value="Atender" id="btAtender">

  </p>

  <h3>
    Em Atendimento:
    <span id="outAtendimento" class="fonteAzul"></span>
  </h3>

  <pre id="outLista"></pre>

  <script src="js/ex5_1.js"></script>

</body>

</html>
