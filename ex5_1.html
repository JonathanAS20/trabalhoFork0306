<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="css/estilos.css">
  <title>Consultório Odontológico</title>
</head>

<body>

  <img src="site-odontologico.webp"
       alt="Consultório Odontológico"
       class="alta">
  <h1>Consultório Odontológico</h1>
  <p>
    Paciente:
    <input type="text" id="inPaciente" autofocus>
    <input type="button" value="Adicionar" id="btAdicionar">
    <input type="button" value="Urgência" id="btUrgencia">
    <input type="button" value="Atender" id="btAtender">
  </p>
  <h3>
    Em Atendimento:
    <span id="outAtendimento" class="fonteAzul"></span>
  </h3>
  <h3>
    Total de Atendimentos:
    <span id="outQtd" class="fonteAzul">0</span>
  </h3>
  <h3>
    Último Paciente Atendido:
    <span id="outUltimo" class="fonteAzul">Nenhum</span>
  </h3>
  <h3>Fila de Espera</h3>
  <pre id="outLista"></pre>
  <h3>Histórico de Atendimentos</h3>
  <pre id="outHistorico"></pre>
  <script src="js/ex5_1.js"></script>
</body>
</html>
