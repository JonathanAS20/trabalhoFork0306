<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="ie=edge">
  <link rel="stylesheet" href="css/estilos.css">
  <title>Consultório Odontológico</title>
</head>

<body>

  <img src="site-odontologico.webp" alt="Consultório Odontológico" class="alta">

  <h1>Consultório Odontológico</h1>

  <p>
    Paciente:
    <input type="text" id="inPaciente" autofocus>
  </p>

  <p>
    Especialidade:
    <select id="inEspecialidade">
      <option>Cirurgia e Traumatologia Buco Maxilo Facial</option>
      <option>Cirurgia Oral</option>
      <option>Clínico Geral</option>
      <option>Dentística</option>
      <option>Endodontia</option>
      <option>Harmonização Orofacial</option>
      <option>Implantodontia</option>
      <option>Odontopediatria</option>
      <option>Ortodontia</option>
      <option>Periodontia</option>
      <option>Prevenção</option>
      <option>Prótese</option>
      <option>Radiologia</option>
      <option>Urgência/Emergência</option>
    </select>
  </p>

  <p>
    <input type="button" value="Adicionar" id="btAdicionar">
    <input type="button" value="Preferencial" id="btPreferencial">
    <input type="button" value="Urgência" id="btUrgencia">
    <input type="button" value="Atender" id="btAtender">
  </p>

  <h3>
    Em Atendimento:
    <span id="outAtendimento" class="fonteAzul"></span>
  </h3>

  <pre id="outLista"></pre>

  <script src="js/ex5_1.js"></script>

</body>

</html>
